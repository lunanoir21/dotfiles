# Sabit "smooth siyah" renk şeması. Matugen kaldırıldı (bkz. commit geçmişi) —
# bu dosya artık runtime'da üretilmiyor, elle düzenlenen statik bir tema.

# Basic colors
foreground              #e2e2e2
background              #131313
selection_foreground    #e2e2e2
selection_background    #474747

# Cursor colors
cursor                  #ffffff
cursor_text_color       #1b1b1b

# URL underline color when hovering with mouse
url_color               #e2e2e2

# Kitty window border colors
active_border_color     #ffffff
inactive_border_color   #474747
bell_border_color       #ffb4ab

# OS Window titlebar colors
wayland_titlebar_color  system
macos_titlebar_color    system

# Tab bar colors
active_tab_foreground   #000000
active_tab_background   #d4d4d4
inactive_tab_foreground #c6c6c6
inactive_tab_background #1f1f1f
tab_bar_background      #131313

# Colors for marks
mark1_foreground #1b1b1b
mark1_background #ffffff
mark2_foreground #1b1b1b
mark2_background #c6c6c6
mark3_foreground #1b1b1b
mark3_background #e2e2e2

# The 16 terminal colors
# Smooth monochrome ramp (kept independent of the Material roles above, which
# don't map cleanly onto ANSI slots in a monochrome scheme). Red stays
# functional for errors/diffs; everything else is a flat gray ramp.

# black
color0 #1a1a1a
color8 #3a3a3a

# red
color1 #ffb4ab
color9 #ff8a80

# green
color2  #a0a0a0
color10 #c0c0c0

# yellow
color3  #b8b8b8
color11 #d8d8d8

# blue
color4  #909090
color12 #b0b0b0

# magenta
color5  #888888
color13 #a8a8a8

# cyan
color6  #808080
color14 #989898

# white
color7  #cfcfcf
color15 #f0f0f0
