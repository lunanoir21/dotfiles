#  ◈ SETTINGS (AUTOGENERATED FROM SETTINGS.JSON)
#
#  Bu dosyayı elle düzenleme — settings_watcher.sh her settings.json yazımında
#  templates/settings.conf.template'ten yeniden üretiyor. Değerler settings.json
#  içindeki "hypr" nesnesinden geliyor; anahtar yoksa buradaki varsayılan kullanılır.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

general {
    border_size = 0
    gaps_in = 4
    gaps_out = 4
    float_gaps = 6
    resize_on_border = true
    extend_border_grab_area = 30
    col.active_border=$active_border
    col.inactive_border=$inactive_border
}

decoration {
    rounding = 4
    active_opacity = 1
    inactive_opacity = 1
    blur {
        enabled = true
        size = 9
        passes = 2
        new_optimizations = true
    }
    shadow {
        enabled = false
    }
}

input {
    kb_layout = us
    kb_options = grp:alt_shift_toggle
    sensitivity = 0

    touchpad {
        natural_scroll = true
    }
}

cursor {
    no_warps = true
}

misc {
    font_family = JetBrains Mono
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 5, myBezier, popin 80%
    animation = windowsOut, 1, 5, myBezier, popin 80%
    animation = layers, 1, 5, myBezier, fade
    animation = layersIn, 1, 5, myBezier, fade
    animation = layersOut, 1, 5, myBezier, fade
    animation = fade, 1, 5, myBezier
    animation = workspaces, 1, 5, myBezier, slide
    animation = specialWorkspaceIn, 1, 5, myBezier, fade
    animation = specialWorkspaceOut, 1, 5, myBezier, fade
}
