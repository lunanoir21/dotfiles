source = ~/.config/hypr/config/env.conf
# Tema kenarlık renkleri. scripts/theme.sh her tema değişiminde bu dosyayı
# yeniden yazıyor; source edilmediği sürece yazdıkları hiçbir işe yaramıyordu.
source = ~/.config/hypr/colors.conf
# --------------------------------------------------------------------------------------
#
#   ██╗██╗  ██╗   ██╗ █████╗ ███╗   ███╗██╗██████╗  ██████╗
#   ██║██║  ╚██╗ ██╔╝██╔══██╗████╗ ████║██║██╔══██╗██╔═══██╗
#   ██║██║   ╚████╔╝ ███████║██╔████╔██║██║██████╔╝██║   ██║
#   ██║██║    ╚██╔╝  ██╔══██║██║╚██╔╝██║██║██╔══██╗██║   ██║
#   ██║███████╗██║   ██║  ██║██║ ╚═╝ ██║██║██║  ██║╚██████╔╝
#   ╚═╝╚══════╝╚═╝   ╚═╝  ╚═╝╚═╝     ╚═╝╚═╝╚═╝  ╚═╝ ╚═════╝
#
#   Created by ilyamiro
#   https://github.com/ilyamiro/nixos-configuration
#
# --------------------------------------------------------------------------------------

bind = SUPER, T, exec,
bind = CTRL SHIFT, S, exec, grimblast --notify copy area

# Tapping Super on its own opens/closes the Dynamic Island; SUPER+<key> combos
# are unaffected. This slot previously ran qs-workspace.sh, which no longer worked.
bind = SUPER, Super_L, exec, qs -p ~/.config/hypr/scripts/quickshell/Shell.qml ipc call dynamicIsland toggle

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ◈ MONITORS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

monitor=eDP-1,1920x1080@144,0x0,1


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ◈ ENVIRONMENT VARIABLES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

env = NIXOS_OZONE_WL,1
# env = AQ_NO_ATOMIC,1  # kaldırıldı: legacy DRM page-flip donmasına sebep oluyordu

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ◈ AUTOSTART
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

exec-once = awww-daemon
exec-once = hypridle -c ~/.config/hypr/hypridle/hypridle.conf
exec-once = quickshell -p ~/.config/hypr/scripts/quickshell/Shell.qml
exec-once = ~/.config/hypr/scripts/init.sh
exec-once = playerctld
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = ~/.config/hypr/scripts/volume_listener.sh
exec-once = systemctl --user enable --now easyeffects


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ◈ CORE VARIABLES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

$mainMod = SUPER
$terminal = kitty

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ◈ SETTINGS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

general {
    border_size = 0
    gaps_in = 4
    gaps_out = 4
    float_gaps = 6
    resize_on_border = true
    extend_border_grab_area = 30
    col.active_border = $active_border
    col.inactive_border = $inactive_border
}

decoration {
    rounding = 8
    rounding_power = 4.0
    active_opacity = 1.0
    inactive_opacity = 1.0
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

input {
    kb_layout = tr
    kb_options = grp:alt_shift_toggle

    touchpad {
        natural_scroll = true
    }
}

cursor {
    no_warps = true
    no_hardware_cursors = true
}

misc {
    font_family = JetBrains Mono
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

animations {
    enabled = yes
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    bezier = wsQuick, 0.19, 1, 0.22, 1
    animation = windows, 1, 5, myBezier, popin 80%
    animation = windowsOut, 1, 5, myBezier, popin 80%
    animation = layers, 1, 5, myBezier, fade
    animation = layersIn, 1, 5, myBezier, fade
    animation = layersOut, 1, 5, myBezier, fade
    animation = fade, 1, 5, myBezier
    animation = workspaces, 1, 3, wsQuick, slide
    animation = specialWorkspaceIn, 1, 5, myBezier, fade
    animation = specialWorkspaceOut, 1, 5, myBezier, fade
}


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ◈ WINDOW & LAYER RULES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

layerrule {
    name = "lr1"
    match:namespace = ^(volume_osd)$
    no_anim = on
}

layerrule {
    name = "lr2"
    match:namespace = ^(brightness_osd)$
    no_anim = on
}

layerrule {
    name = "lr3"
    match:namespace = hyprpicker
    no_anim = on
}

layerrule {
    name = "lr5"
    match:namespace = ext-session-lock
    blur = on
    ignore_alpha = 0.2
}

layerrule {
    name = "lr6"
    match:namespace = ^(quay|quay-settings)$
    blur = on
    ignore_alpha = 0.2
}

windowrule {
    name = "app_launcher"
    match:title = ^(app-launcher)$
    float = on
    center = on
    size = 1200 600
    animation = slide
}

windowrule {
    name = "master_rule"
    match:title = ^(qs-master)$
    float = on
    no_shadow = on
    no_initial_focus = on
}


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ◈ KEYBINDINGS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ───────── Mouse & Gestures ─────────
gesture = 3, horizontal, workspace
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# ───────── Window Management ─────────
bind = ALT, F4, exec, bash -c 'if hyprctl activewindow | grep -q "title: qs-master"; then ~/.config/hypr/scripts/qs_manager.sh close; else hyprctl dispatch killactive; fi'
bind = $mainMod, Q, exec, bash -c 'if hyprctl activewindow | grep -q "title: qs-master"; then ~/.config/hypr/scripts/qs_manager.sh close; else hyprctl dispatch killactive; fi'
bind = $mainMod&SHIFT_L, F, exec, bash -c 'if ! hyprctl activewindow | grep -q "title: qs-master"; then hyprctl dispatch togglefloating; fi'
binde = $mainMod&SHIFT_L, left, resizeactive,-50 0
binde = $mainMod&SHIFT_L, right, resizeactive,50 0
binde = $mainMod&SHIFT_L, up, resizeactive,0 -50
binde = $mainMod&SHIFT_L, down, resizeactive,0 50
bind = $mainMod&CTRL, left, movewindow, l
bind = $mainMod&CTRL, right, movewindow, r
bind = $mainMod&CTRL, up, movewindow, u
bind = $mainMod&CTRL, down, movewindow, d
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# ───────── Applications & Launchers ─────────
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, F, exec, qs -p ~/.config/hypr/scripts/quickshell/Shell.qml ipc call quay toggle
bind = $mainMod, E, exec, nautilus
bind = $mainMod, D, exec, ~/.config/hypr/scripts/qs_manager.sh toggle applauncher
bind = ALT, TAB, exec, ~/.config/hypr/scripts/qs_manager.sh toggle applauncher
bind = $mainMod, TAB, exec, ~/.config/hypr/scripts/qs_manager.sh toggle workspaces
bind = $mainMod, C, exec, ~/.config/hypr/scripts/qs_manager.sh toggle clipboard

# Dynamic Island — expanded panel's quick-settings page. $mainMod ALT rather
# than plain $mainMod+Left/Right, which already move window focus, or
# $mainMod+CTRL+Left/Right, which already move the window itself.
bind = $mainMod ALT, Left, exec, qs -p ~/.config/hypr/scripts/quickshell/Shell.qml ipc call dynamicIsland pagePrev
bind = $mainMod ALT, Right, exec, qs -p ~/.config/hypr/scripts/quickshell/Shell.qml ipc call dynamicIsland pageNext

# ───────── Quickshell Controls ─────────
bind = $mainMod, B, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle sidebarcenter
bind = $mainMod, W, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle wallpaper
# Quay: kısayol modundayken dikey başlatıcıyı aç/kapat, ve kendi ayar paneli.
bind = $mainMod SHIFT, D, exec, qs -p ~/.config/hypr/scripts/quickshell/Shell.qml ipc call quay toggle
bind = $mainMod SHIFT, Q, exec, qs -p ~/.config/hypr/scripts/quickshell/Shell.qml ipc call quay settings
# flare: Aura'da sağlayıcılar arasında geç, kompakt paneli aç/kapat.
bind = $mainMod, right, exec, qs -p ~/.config/hypr/scripts/quickshell/Shell.qml ipc call flare next
bind = $mainMod, left, exec, qs -p ~/.config/hypr/scripts/quickshell/Shell.qml ipc call flare prev
bind = $mainMod, U, exec, qs -p ~/.config/hypr/scripts/quickshell/Shell.qml ipc call flare toggle
bind = $mainMod SHIFT, U, exec, qs -p ~/.config/hypr/scripts/quickshell/Shell.qml ipc call flare toggleVisible
bind = $mainMod, M, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle monitors
bind = CTRL SHIFT, K, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle processes
bind = $mainMod, H, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle settings
# Ses karıştırıcı: uygulama başına dikey ekolayzer sürgüleri.
bind = $mainMod, V, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle mixer

# ───────── Screenshot ─────────
bind = $mainMod, S, exec, spotify
bind = $mainMod&SHIFT_L, S, exec, ~/.config/hypr/scripts/screenshot.sh --edit
bind = $mainMod, Z, exec, firefox
bind = , Print, exec, ~/.config/hypr/scripts/screenshot.sh --full
bind = SHIFT_L, Print, exec, ~/.config/hypr/scripts/screenshot.sh --full --edit

# ───────── System & Hardware ─────────
bind = SUPER SHIFT, G, exec, bash ~/.config/hypr/scripts/toggle_bw_mode.sh
bindl = , Caps_Lock, exec, sleep 0.1 && swayosd-client --caps-lock
bindl = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower
bindl = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bindl = , XF86PowerOff, exec, bash ~/.config/hypr/scripts/lock.sh
bind = SUPER, L, exec, bash ~/.config/hypr/scripts/lock.sh
bind = SUPER SHIFT, L, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle lockscreen

# ───────── Media & Audio ─────────
bindl = $mainMod, SPACE, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , xf86AudioMicMute, exec, swayosd-client --input-volume mute-toggle
bindl = , xf86audiomute, exec, swayosd-client --output-volume mute-toggle
bindel = , xf86audiolowervolume, exec, swayosd-client --output-volume lower
bindel = , xf86audioraisevolume, exec, swayosd-client --output-volume raise

# ───────── Workspaces ─────────
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# ───────── Move window under cursor to workspace (Super+Tab → 1-9) ─────────

# ───────── Move window under cursor to workspace (Super+Alt+1-9) ─────────


#SİGNAL BAŞLATMA
exec-once = gnome-keyring-daemon --start --components=secrets,pkcs11


# jcode (personal launcher tool, not part of this rice) hotkeys removed here —
# they were written into hyprland.conf by jcode's own installer on the source
# machine and only make sense with that tool installed.
