# --------------------------------------------------------------------------------------
#  HYPRIDLE — lunanoir
#  Bu dosya artık ~/.config/hypr/hypridle/ altında yaşıyor (eski konum:
#  ~/.config/hypr/hypridle.conf). hyprland.conf içindeki exec-once bu dosyayı
#  -c ile işaret ediyor.
#
#  Eski dosyada suspend (1200s) lock'tan (1800s) ÖNCE tetikleniyordu, yani
#  sistem hiç kilitlenmeden uykuya dalıyordu. Sıra burada düzeltildi:
#  ekran kararması → kilit → uyku.
# --------------------------------------------------------------------------------------

general {
    lock_cmd = bash ~/.config/hypr/hypridle/lock.sh
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 1) 5 dk boşta: ekranı karart (henüz kilitleme)
listener {
    timeout = 300
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 2) 6 dk boşta: kilitle
listener {
    timeout = 360
    on-timeout = loginctl lock-session
}

# 3) 15 dk boşta: uykuya al (kilitlendikten sonra)
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
